name: Weekly Security Audit Scheduler

on:
  schedule:
    # Runs at 09:00 UTC every Monday
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allows you to manually trigger it from the Actions tab for testing

permissions:
  issues: write

jobs:
  create_audit_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Issue using GitHub CLI
        run: |
          gh issue create \
            --title "[security] Weekly Security Audit: Dependabot & Security Alerts" \
            --body "### Dependabot & Security Alert Audit

          Team, please go through the following **7 repositories** to review, fix, and resolve any outstanding Dependabot or security alerts. 

          #### **Action Items per Repository:**
          1. Click the links below and navigate to the **Dependabot alerts** on each repo.
          2. Review and merge open Dependabot automated PRs where tests pass.
          3. Manually bump dependencies for vulnerabilities requiring manual intervention.
          4. **Update the checklist below** and comment when your assigned repo is fully cleared!

          ---

          ### Repository Checklist
          *When you complete a repository, please check it off above and drop a confirmation note below detailing what was fixed or if any alerts were explicitly dismissed with a valid reason.*
          
          - [ ] **crkn_iiif_content_search** (Ruby / Rails API)  [GitHub Repository](https://github.com/crkn-rcdr/crkn_iiif_content_search/security) 
          - [ ] **crkn_download_api**  [GitHub Repository](https://github.com/crkn-rcdr/crkn_download_api/security)
          - [ ] **crkn-IIIF-presentation-api** (Python / FastAPI)  [GitHub Repository](https://github.com/crkn-rcdr/crkn-IIIF-presentation-api/security)
          - [ ] **noid-ark**  [GitHub Repository](https://github.com/crkn-rcdr/noid-ark/security) 
          - [ ] **crkn_base_blacklight** (Ruby / Rails 7 + Blacklight 8)  [GitHub Repository](https://github.com/crkn-rcdr/crkn_base_blacklight/security)
          - [ ] **windmill** [GitHub Repository](https://github.com/crkn-rcdr/crkn-windmill/security)
          - [ ] **cap** [GitHub Repository](https://github.com/crkn-rcdr/cap/security)
          
          ---" \
            --label "security" \
            --assignee "${{ github.actor }}" \
            --assignee "jmacgreg"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
